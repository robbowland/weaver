# weaver: this file is weaver's. It brings the Micrographics theme for its review
# panel (tuicr --theme micrographics) and keeps it up to date while this line
# stays. Remove the line, and the file is yours.
#
# Micrographics for tuicr, quiet: black, with ink for structure, interface
# text in metadata grey, the dim tones below code's darkest, and green and
# red only for change, its tints faint. Code and diff tokens take their
# colours from the TextMate theme beside it. Black as named, but the
# panel's, which is hex: tuicr blends search matches into it.
panel_bg = "#000000"
bg_highlight = "black"
fg_primary = "#ffffff"
fg_secondary = "#999999"
fg_dim = "#444444"

syntax_theme = "Micrographics.tmTheme"

diff_add = "#39d97a"
diff_add_bg = "#07110b"
diff_del = "#ff3b2f"
diff_del_bg = "#120807"
diff_context = "#ffffff"
diff_hunk_header = "#444444"
expanded_context_fg = "#3a3a3a"

syntax_add_bg = "#07110b"
syntax_del_bg = "#120807"

file_added = "#39d97a"
file_modified = "#999999"
file_deleted = "#ff3b2f"
file_renamed = "#616161"
file_header = "#ffffff"

reviewed = "#39d97a"
pending = "#333333"

comment_note = "#999999"
comment_suggestion = "#ffffff"
comment_issue = "#ff3b2f"
comment_praise = "#39d97a"

border_focused = "#616161"
border_unfocused = "#1f1f1f"
status_bar_bg = "black"
cursor_color = "#ffffff"
cursor_line_bg = "black"
branch_name = "#444444"
help_indicator = "#444444"

message_info_fg = "#000000"
message_info_bg = "#ffffff"
message_warning_fg = "#000000"
message_warning_bg = "#999999"
message_error_fg = "#000000"
message_error_bg = "#ff3b2f"
update_badge_fg = "#000000"
