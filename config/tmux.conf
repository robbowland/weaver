# weaver's tmux (`wvr`): its own server (tmux -L weaver), so none of this
# touches a tmux of yours. Home is window 0 and a thread's window index is its
# number; views (GITHUB, LINEAR) are 900 and on. One status line: the strip
# (THREADS, GITHUB, LINEAR: a tab bar, the one you are on in ink), then on a
# thread's window its name ("<num> <name> · <repo>/<branch>") in grey, and
# weaver's counts. White stays for what needs you.
# ~/.config/weaver/tmux.conf, when you have one, is read last.

set -g default-terminal "tmux-256color"
# (Indexed, so reading this again, as `wvr` does, adds nothing twice.)
set -s terminal-features[90] "xterm-ghostty:RGB:extkeys:hyperlinks:usstyle"
set -s terminal-features[91] "xterm*:RGB:extkeys"
set -s extended-keys on
# Keys like Shift+Enter (Claude Code's newline) in the CSI u form apps read,
# where tmux can (3.5+).
%if "#{extended-keys-format}"
set -s extended-keys-format csi-u
%endif
set -s escape-time 10
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
set -g mouse on
set -g history-limit 100000
set -g base-index 0
setw -g pane-base-index 0
set -g renumber-windows off
set -g set-titles on
set -g set-titles-string "#{window_name}"
setw -g allow-rename off

# A finished or waiting agent rings the bell; its window keeps the mark.
set -g monitor-bell on
set -g bell-action other
set -g visual-bell off

# Ink and greys.
set -g status-position bottom
# The counts are the session's @weaver-counts, which weaver sets as they
# change: nothing to poll.
set -g status-interval 0
set -g status-style "bg=default,fg=#999999"
set -g status-left " #{?@weaver-strip,#{E:@weaver-strip},THREADS}#{?#{||:#{==:#{window_index},0},#{@weaver-view}},,#[fg=#616161]   │   #[fg=#999999]#{window_name}}"
set -g status-left-length 120
set -g status-right "#{@weaver-counts}#[fg=#616161]#{?pane_in_mode,[CPY],#{?client_prefix,[PFX],[NRM]}} "
set -g status-right-length 60
setw -g window-status-format ""
setw -g window-status-current-format ""
setw -g window-status-separator ""
# Dividers are one faint line: tmux would light the half of a two-pane
# window's divider beside the focused pane (pane-border-indicators colour),
# which reads as a broken line. Focus shows by the cursor and nvim's bar.
setw -g pane-border-style "fg=#616161"
setw -g pane-active-border-style "fg=#616161"
setw -g pane-border-indicators off
setw -g pane-border-lines single
set -g message-style "bg=default,fg=#ffffff"
set -g message-command-style "bg=default,fg=#ffffff"
setw -g mode-style "bg=#ffffff,fg=#000000"
set -g popup-border-style "fg=#616161"
set -g popup-border-lines single
setw -g popup-style "bg=default,fg=default"
setw -g menu-style "bg=default,fg=#ffffff"
setw -g menu-selected-style "bg=#ffffff,fg=#000000"
setw -g menu-border-style "fg=#616161"
setw -g copy-mode-match-style "bg=#616161,fg=#ffffff"
setw -g copy-mode-current-match-style "bg=#ffffff,fg=#000000"
setw -g copy-mode-mark-style "bg=#999999,fg=#000000"
setw -g clock-mode-colour "#999999"
set -g display-panes-colour "#616161"
set -g display-panes-active-colour "#ffffff"
# tmux 3.8 colours what the lines above leave out (scrollbars, tree mode,
# the fill around a smaller client) from a theme: ink and greys, where it has
# one. Older tmux has no theme options, and the test is then false.
%if "#{dark-theme-black}"
set -s theme dark
set -s dark-theme-black "#000000"
set -s dark-theme-dark-grey "#000000"
set -s dark-theme-light-grey "#999999"
set -s dark-theme-white "#ffffff"
set -s dark-theme-red "#ff3b2f"
set -s dark-theme-green "#39d97a"
set -s dark-theme-yellow "#ffffff"
set -s dark-theme-blue "#999999"
set -s dark-theme-cyan "#999999"
set -s dark-theme-magenta "#ffffff"
%endif

# weaver's keys, without a prefix: Alt y the board over a thread (on home,
# the views and back), Alt N a
# new thread (in a view: from the item under the cursor; Alt R a read-only
# review of it), Alt v the agent's nvim (Alt V full screen), Alt 1 the next
# agent that needs you, Alt j / Alt k the next / previous window (past the
# views), Alt h / Alt l the
# pane to the left / right, Ctrl q quits the session (its threads come back
# as weaver starts; while an agent works or waits on you, whose turn would
# stop, it asks first). run-shell would show what they print, or a failure, over
# your pane; the new-thread popup (wvr _popup new) is sized to the terminal,
# as every dialog of weaver's is, and runs weaver itself, not through your
# shell (whose startup it would wait on).
# Alt y in a thread: the board in a popover over it, from the thread's
# directory (where a new thread's form starts).
bind -n M-y run-shell -b -c "#{pane_current_path}" "wvr go home >/dev/null 2>&1 || true"
# The views (GITHUB, LINEAR) bind Alt N and Alt R themselves, with the row
# under their cursor.
bind -n M-N if -F "#{@weaver-view}" { send-keys M-N } {
	run-shell -b -c "#{pane_current_path}" "wvr _popup new >/dev/null 2>&1 || true"
}
bind -n M-v run-shell -b "wvr edit '#{pane_id}' >/dev/null 2>&1 || true"
bind -n M-V run-shell -b "wvr edit --full '#{pane_id}' >/dev/null 2>&1 || true"
bind -n M-1 run-shell -b "wvr next >/dev/null 2>&1 || true"
bind -n M-j { next-window; if -F "#{@weaver-view}" { next-window; if -F "#{@weaver-view}" { next-window } } }
bind -n M-k { previous-window; if -F "#{@weaver-view}" { previous-window; if -F "#{@weaver-view}" { previous-window } } }
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n C-q if -F "#{@weaver-busy}" {
	confirm-before -p "weaver: an agent is mid-turn, and quitting stops it (its thread comes back). Quit? (y/n)" kill-session
} { kill-session }
# The mouse, as a desktop app has it. A click on THREADS, GITHUB or LINEAR
# (the status line's strip) goes there, one on the counts to the agent that
# needs you (or, working, home). A right click opens weaver's menu of what
# can be done where it is: a row of the board or a view (whose list, taking
# the mouse, is told where the click was), the status line, a pane. In
# place of tmux's menus, whose Kill and Respawn would end an agent behind
# weaver's back; Alt and a right click still opens tmux's.
# (On the release, as a button: a second click soon after the first is
# tmux's double click, never its MouseDown.)
bind -n MouseDown1Status if -F "#{==:#{mouse_status_range},window}" { switch-client -t = }
bind -n MouseUp1Status if -F "#{!=:#{mouse_status_range},window}" {
	run-shell -b "wvr _click status '#{mouse_status_range}' >/dev/null 2>&1 || true"
}
bind -n MouseDown3Status run-shell -b "wvr _menu status '#{client_name}' '#{mouse_x}' >/dev/null 2>&1 || true"
bind -n MouseDown3StatusLeft run-shell -b "wvr _menu status '#{client_name}' '#{mouse_x}' >/dev/null 2>&1 || true"
bind -n MouseDown3StatusRight run-shell -b "wvr _menu status '#{client_name}' '#{mouse_x}' >/dev/null 2>&1 || true"
bind -n MouseDown3StatusDefault run-shell -b "wvr _menu status '#{client_name}' '#{mouse_x}' >/dev/null 2>&1 || true"
bind -n MouseDown3Pane if -F -t = "#{mouse_any_flag}" {
	set -pF -t = @weaver-mouse "#{client_name} #{e|+:#{pane_left},#{mouse_x}} #{e|+:#{pane_top},#{mouse_y}}"
	select-pane -t =
	send-keys -M -t =
} {
	run-shell -b -t = "wvr _menu pane '#{client_name}' #{e|+:#{pane_left},#{mouse_x}} #{e|+:#{pane_top},#{mouse_y}} '#{pane_id}' >/dev/null 2>&1 || true"
}
# Scrolling back (the wheel, in a pane whose program takes no mouse) shows
# where you are: a scrollbar to drag, gone as you leave. tmux 3.6 and on.
%if "#{pane-scrollbars}"
setw -g pane-scrollbars modal
setw -g pane-scrollbars-style "fg=#999999,bg=default"
%endif

# A narrower window takes its columns from the rightmost pane, a thread's
# agent: give it its width back.
set-hook -g window-resized[10] 'run-shell -b "wvr _fit #{window_id} >/dev/null 2>&1 || true"'
# A window weaver flagged as holding an agent done and unseen: seen once you
# have stayed on it a moment (passing through, it stays new).
set-hook -g pane-focus-in[10] {
	if -F "#{@weaver-unseen}" {
		run-shell -b "sleep 1.5; wvr _seen #{window_id} >/dev/null 2>&1 || true"
	}
}

# Pane splits, on whatever keys the terminal sends as these (Ghostty:
# keybind = super+alt+d=csi:100;9~). Not as kitty-protocol keys
# (csi:100;9u), which tmux reads as Alt+d, Option+d's own.
set -s user-keys[0] "\e[100;9~"
set -s user-keys[1] "\e[100;10~"
bind -n User0 split-window -h -c "#{pane_current_path}"
bind -n User1 split-window -v -c "#{pane_current_path}"

source-file -q "~/.config/weaver/tmux.conf"
