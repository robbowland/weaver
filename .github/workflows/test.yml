name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # weaver is macOS only (sysctl, termios).
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          # Old findings are being worked down; new code adds none.
          only-new-issues: true
      # No Rex here: test/hooks.sh and test/rex.sh skip.
      - run: brew install fzf jq worktrunk
      - run: |
          git config --global user.name weaver-ci
          git config --global user.email weaver-ci@example.com
      - run: test/run.sh
