version: "2"

linters:
  default: none
  enable:
    - errcheck
    - exhaustive
    - gochecksumtype
    - gocyclo
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused
  settings:
    # Unchecked: output to the terminal, removing what may already be gone,
    # exec, which returns only when it failed, and tmux commands that steer
    # the session (select, resize, rename, flag), which a caller needing
    # their result reads. Everything else is checked or named as
    # best-effort.
    errcheck:
      exclude-functions:
        - (*github.com/robbowland/weaver/internal/session.Env).Tmux
        - (github.com/robbowland/weaver/internal/tmux.Session).Run
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - os.Remove
        - os.RemoveAll
        - syscall.Exec
    # A switch over a closed set (a state, a kind of item) names every case:
    # a new case breaks every switch that has not handled it.
    exhaustive:
      default-signifies-exhaustive: false
    gochecksumtype:
      default-signifies-exhaustive: false
    # A ceiling that comes down as the big functions split.
    gocyclo:
      min-complexity: 115
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: increment-decrement
        - name: var-naming
        - name: range
        - name: receiver-naming
        - name: indent-error-flow
        - name: errorf
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: unused-parameter

formatters:
  enable:
    - gofmt
